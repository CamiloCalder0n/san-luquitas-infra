# VirtualHost de Moodle
# Instalar con: sudo cp moodle/moodle.conf /etc/apache2/sites-available/moodle.conf
<VirtualHost *:80>
    ServerName sanluquitas.local
    ServerAlias *

    # Desde Moodle 5.1 solo la carpeta public/ queda expuesta a la web
    DocumentRoot /var/www/moodle/public
    DirectoryIndex index.php

    <Directory /var/www/moodle/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        # Router de Moodle
        FallbackResource /r.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/moodle_error.log
    CustomLog ${APACHE_LOG_DIR}/moodle_access.log combined
</VirtualHost>
